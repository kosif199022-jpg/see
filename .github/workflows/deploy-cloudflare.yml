name: Deploy SEE to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: see-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SEE_APP_ACCESS_TOKEN: ${{ secrets.SEE_APP_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets."
            exit 1
          fi
      - name: Install
        run: npm install
      - name: Verify
        run: npm test && npm run typecheck && npm run build
      - name: Ensure R2 evidence bucket
        working-directory: apps/cloudflare
        run: |
          set -o pipefail
          if npx wrangler r2 bucket list | grep -Fq "see-audit-evidence"; then
            echo "R2 bucket see-audit-evidence already exists."
          else
            npx wrangler r2 bucket create see-audit-evidence
          fi
      - name: Deploy application
        working-directory: apps/cloudflare
        run: npx wrangler deploy
      - name: Apply D1 migrations
        working-directory: apps/cloudflare
        run: npx wrangler d1 migrations apply DB --remote
      - name: Configure optional access token
        if: ${{ env.SEE_APP_ACCESS_TOKEN != '' }}
        working-directory: apps/cloudflare
        run: printf '%s' "$SEE_APP_ACCESS_TOKEN" | npx wrangler secret put APP_ACCESS_TOKEN
      - name: Deploy migrated application
        working-directory: apps/cloudflare
        run: npx wrangler deploy
