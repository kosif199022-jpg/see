name: KOSIF C Free URL to Video
on:
  push:
    branches: [codex/kosif-free-render-poc]
    paths:
      - 'video_jobs/**'
      - '.github/workflows/kosif-c-video-fetch.yml'
permissions:
  contents: read
jobs:
  download:
    name: Public video to iPhone MP4
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free downloader + FFmpeg
        run: |
          python -m pip install 'yt-dlp>=2025.1'
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Find one new job (never run arbitrary code)
        run: |
          JOB=$(git show --pretty=format: --name-only HEAD | grep -E '^video_jobs/[a-z0-9_-]{1,64}\.json$' | head -1)
          test -n "$JOB"
          echo "KOSIF_JOB_FILE=$JOB" >> "$GITHUB_ENV"
      - name: Download and normalize public video
        run: |
          python tools/cloud_video/fetch.py "$KOSIF_JOB_FILE"
      - name: Verify video and receipt
        run: |
          test -s output/KOSIF-C-Video.mp4
          test -s output/KOSIF-C-Video-receipt.json
          ffprobe -v error -show_entries stream=codec_name -show_entries format=duration -of json output/KOSIF-C-Video.mp4
      - name: Upload validated MP4
        uses: actions/upload-artifact@v4
        with:
          name: kosif-c-video-${{ github.run_id }}
          path: output/
          retention-days: 7
