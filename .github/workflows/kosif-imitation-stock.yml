name: KOSIF Imitation Licensed Stock Footage
on:
  push:
    branches: [codex/kosif-free-render-poc]
    paths:
      - 'imitation_jobs/**'
permissions:
  contents: read
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP client and FFmpeg
        run: |
          python -m pip install 'requests>=2.30,<3'
          command -v ffmpeg
      - name: Download authorized stock and prepare vertical motion clips
        run: python tools/imitate/pull_stock.py
      - name: Upload source footage and attribution manifest
        uses: actions/upload-artifact@v4
        with:
          name: kosif-imitation-stock
          path: output/stock/
          retention-days: 2
