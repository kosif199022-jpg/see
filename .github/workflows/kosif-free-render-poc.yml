name: KOSIF Free CPU Video Rendering
on:
  push:
    branches: [codex/kosif-free-render-poc]
    paths:
      - 'render_jobs/**'
      - 'tools/cloud_render/**'
      - '.github/workflows/kosif-free-render-poc.yml'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds from 1 to 30'
        required: true
        default: '3'
permissions:
  contents: read
jobs:
  render:
    name: Python + FFmpeg rendered MP4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and locate FFmpeg
        run: |
          python -m pip install pillow==11.3.0
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Validate job manifest and limits
        run: python tools/cloud_render/select_job.py
      - name: Render preset with Python + FFmpeg
        run: |
          python tools/cloud_render/render.py \
            --seconds "$KOSIF_SECONDS" --fps "$KOSIF_FPS" \
            --width "$KOSIF_WIDTH" --height "$KOSIF_HEIGHT" \
            --scene "$KOSIF_SCENE" --output output/kosif-video.mp4
      - name: Inspect encoded media
        run: |
          ffprobe -v error -show_entries stream=codec_name -show_entries format=duration -of json output/kosif-video.mp4
          test -s output/kosif-video.mp4
          test -s output/kosif-video.json
      - name: Upload MP4 + integrity receipt
        uses: actions/upload-artifact@v4
        with:
          name: kosif-video-${{ github.run_id }}
          path: output/
          retention-days: 7
