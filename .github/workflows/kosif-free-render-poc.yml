name: KOSIF Free CPU Video Rendering
on:
  push:
    branches: [codex/kosif-free-render-poc]
    paths:
      - 'tools/cloud_render/**'
      - '.github/workflows/kosif-free-render-poc.yml'
  workflow_dispatch:
    inputs:
      seconds:
        description: '1–30 seconds'
        required: true
        default: '3'
permissions:
  contents: read
jobs:
  render:
    name: Python + FFmpeg render smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow and locate FFmpeg
        run: |
          python -m pip install pillow==11.3.0
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Render 3-second daylight ocean shark sample
        env:
          SECONDS: ${{ github.event.inputs.seconds || '3' }}
        run: python tools/cloud_render/render.py --seconds "$SECONDS" --fps 24 --width 480 --height 270 --scene ocean-shark-day --output output/kosif-shark.mp4
      - name: Inspect actual audio/video
        run: |
          ffprobe -v error -show_entries stream=codec_name -show_entries format=duration -of json output/kosif-shark.mp4
          test -s output/kosif-shark.mp4
          test -s output/kosif-shark.json
      - name: Attach MP4 and QA receipt
        uses: actions/upload-artifact@v4
        with:
          name: kosif-video-${{ github.run_id }}
          path: output/
          retention-days: 7
